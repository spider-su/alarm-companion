name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  android-apk:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu 24.04 runners provide the SDK location, but cmdline-tools may
      # not be installed. Install the official command-line tools explicitly.
      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$RUNNER_TEMP/android-commandlinetools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - name: Generate native Android project locally
        run: npx expo prebuild --clean --platform android
      - name: Assemble debug APK on GitHub runner
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: alarm-companion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
